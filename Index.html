<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#1976d2">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="style.css">

    <title>GPS Track</title>
</head>

<body>

<header>
    <h1>GPS Track</h1>
</header>

<main>

    <section class="controls">

        <button id="startButton" class="start">
            START
        </button>

        <button id="stopButton" class="stop" disabled>
            STOP
        </button>

    </section>

    <section class="status">
        <div>
            <span>Status</span>
            <strong id="status">Stopped</strong>
        </div>

        <div>
            <span>Distance</span>
            <strong id="distance">0.00 km</strong>
        </div>

        <div>
            <span>Points</span>
            <strong id="points">0</strong>
        </div>
    </section>

    <div id="map"></div>

    <section class="tracks">

        <h2>Saved Tracks</h2>

        <div id="trackList">
            No saved tracks
        </div>

    </section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
